server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index launcher.html;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
